<!DOCTYPE html>
<!--
  ============================================================================
  AI-READY BIO / LINK-IN-BIO TEMPLATE - "DEEP BLUE" (tema lautan lepas)
  ============================================================================
  Halaman "link in bio": foto profil + nama + bio singkat + daftar tombol tautan.
  Seluruh layar terasa terendam air: permukaan berbuih putih di atas, berkas
  cahaya & garis tipis di air, gelembung naik, dasar laut gelap, dan ikan
  sungut ganda (anglerfish) berlampu yang berenang menerangi dasar.

  100% SELF-CONTAINED: HTML + CSS + JS satu file, tanpa framework/CDN, jalan OFFLINE.

  CARA PAKAI:
  1. Ubah TEMA (warna & font) di blok :root pada bagian STYLE di bawah.
  2. Isi teks & tautan dengan bantuan AI (lihat PANDUAN-PROMPT-BIO.md di folder induk).
  3. Ganti ASET (foto profil, favicon, link). Cari penanda [[ ... ]].
  4. Tambah/kurangi tombol: duplikat/hapus blok <a class="link"> ... </a>.
  ============================================================================
-->
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- AI INSTRUCTION: Ganti <title> dengan "Nama / @username" (maks 60 karakter) -->
  <title>Deep Blue - Link in Bio</title>
  <!-- AI INSTRUCTION: 1 kalimat deskripsi singkat (maks 150 karakter) -->
  <meta name="description" content="Semua tautan penting dalam satu halaman." />

  <!-- [[ FAVICON: ganti href dengan ikon Anda, mis. favicon.png ]] -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Font: Poppins. Bila offline, otomatis pakai font sistem. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ========================================================================
       PENGATURAN USER - SILAKAN UBAH BAGIAN INI SAJA
       ======================================================================== */
    :root {
      /* --- WARNA AIR (atas terang -> bawah gelap) --- */
      --sea-1:   #7FE3EC;   /* tepat di bawah permukaan */
      --sea-2:   #2AA7C9;
      --sea-3:   #10618F;
      --sea-4:   #072F55;
      --abyss:   #03121F;   /* dasar laut gelap          */
      --foam:    #FFFFFF;   /* buih ombak                */
      --lamp:    #FFE9A8;   /* lampu ikan anglerfish     */

      --text:    #FFFFFF;
      --muted:   rgba(226,246,255,.78);
      --bubble:  rgba(180,235,255,.16);  /* isi tombol gelembung */
      --bubble-line: rgba(255,255,255,.55);

      /* --- FONT --- */
      --font-body: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

      /* --- BENTUK & UKURAN --- */
      --radius-btn: 999px;   /* 999px = gelembung penuh */
      --floor-h:    11rem;   /* tinggi dasar laut                    */
      /* Tinggi LANGIT (di atas permukaan air). Garis air = tengah foto profil,
         jadi padding konten otomatis ikut nilai ini. */
      --sky-h:      13rem;
      --bob:        1;       /* kekuatan gerak mengapung */
    }
    /* ======================================================================== */
    /* JANGAN UBAH KODE DI BAWAH INI KECUALI ANDA PAHAM CSS                      */
    /* ======================================================================== */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body); color: var(--text); min-height: 100vh;
      /* SELURUH LAYAR TERENDAM AIR */
      background: linear-gradient(180deg, var(--sea-1) 0%, var(--sea-2) 22%,
                  var(--sea-3) 48%, var(--sea-4) 74%, var(--abyss) 100%);
      -webkit-font-smoothing: antialiased; overflow-x: hidden; position: relative;
      display: flex; flex-direction: column; align-items: center;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* ===================== ANIMASI ========================================== */
    @keyframes cloudDrift { from { transform: translateX(-12vw); } to { transform: translateX(112vw); } }
    @keyframes drift    { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes floatTilt{ 0%,100% { transform: translateY(calc(-6px * var(--bob))) rotate(-4.5deg); }
                          50%     { transform: translateY(calc(6px * var(--bob))) rotate(2.5deg); } }
    @keyframes bobY     { 0%,100% { transform: translateY(calc(-7px * var(--bob))); }
                          50%     { transform: translateY(calc(7px * var(--bob))); } }
    @keyframes bobSoft  { 0%,100% { transform: translateY(calc(-4px * var(--bob))) rotate(-1deg); }
                          50%     { transform: translateY(calc(4px * var(--bob))) rotate(1deg); } }
    @keyframes riseUp   { 0%   { transform: translate(0, 8vh) scale(.7); opacity: 0; }
                          12%  { opacity: 1; }
                          100% { transform: translate(var(--dx,20px), -104vh) scale(1.15); opacity: 0; } }
    @keyframes shimmer  { 0%,100% { opacity: .55; transform: translateX(0) skewX(-8deg); }
                          50%     { opacity: .95; transform: translateX(14px) skewX(-8deg); } }
    @keyframes lineDrift{ 0%   { transform: translateX(-30px); opacity: 0; }
                          20%,80% { opacity: 1; }
                          100% { transform: translateX(60px); opacity: 0; } }
    @keyframes swayWeed { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes swim     { 0%   { transform: translateX(112vw) scaleX(1); }
                          49%  { transform: translateX(-34vw) scaleX(1); }
                          50%  { transform: translateX(-34vw) scaleX(-1); }
                          99%  { transform: translateX(112vw) scaleX(-1); }
                          100% { transform: translateX(112vw) scaleX(1); } }
    @keyframes lampPulse{ 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    @keyframes finFlap  { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }

    /* ===================== LAPISAN AIR (menetap) ============================ */
    .sea { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

    /* ===================== LANGIT (di atas permukaan air) =================== */
    /* Absolut di puncak dokumen supaya selalu sejajar dengan garis air di foto. */
    .sky { position: absolute; top: 0; left: 0; width: 100%; height: var(--sky-h); z-index: 0;
      overflow: hidden; pointer-events: none;
      background: linear-gradient(180deg, #163A5C 0%, #3D6E96 30%, #7FA8C2 58%,
                  #C6C7C0 80%, #E8CBA4 94%, #F2D9B6 100%); }
    /* cahaya matahari rendah dekat cakrawala */
    .sun { position: absolute; right: 22%; bottom: -10%; width: 16rem; height: 16rem;
      border-radius: 50%; filter: blur(2px);
      background: radial-gradient(circle, rgba(255,232,190,.85) 0%, rgba(255,214,150,.35) 38%, rgba(255,214,150,0) 70%); }
    /* awan tipis (blur, tanpa garis tepi -> tidak terkesan kartun) */
    .cloud { position: absolute; border-radius: 50%; filter: blur(16px);
      background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%);
      animation: cloudDrift linear infinite; }
    /* kabut tipis tepat di atas garis air */
    .haze { position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
      background: linear-gradient(180deg, rgba(255,240,220,0), rgba(255,240,220,.55)); }

    /* berkas cahaya dari permukaan (hanya di bawah garis air) */
    .rays { position: absolute; top: var(--sky-h); left: 0; right: 0; bottom: 0; }
    .rays i { position: absolute; top: 0; width: 12%; height: 62%;
      background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 78%);
      filter: blur(7px); animation: shimmer 7s ease-in-out infinite; }

    /* garis tipis cahaya di air */
    .caustics { position: absolute; top: var(--sky-h); left: 0; right: 0; bottom: 0; }
    .caustics span { position: absolute; height: 1px; border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      animation: lineDrift linear infinite; }

    /* gelembung naik */
    .bubbles { position: absolute; top: var(--sky-h); left: 0; right: 0; bottom: 0; overflow: hidden; }
    .bubbles span { position: absolute; bottom: -6vh; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(255,255,255,.12) 42%, rgba(255,255,255,.05) 70%);
      border: 1px solid rgba(255,255,255,.45); animation: riseUp linear infinite; }

    /* ===================== DASAR LAUT (menetap di bawah) ==================== */
    .floor { position: fixed; left: 0; bottom: 0; z-index: 0; width: 100%; height: var(--floor-h);
      pointer-events: none; }
    .floor svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; display: block; }
    .weed path { transform-origin: bottom center; animation: swayWeed 5.5s ease-in-out infinite; }

    /* ===================== IKAN ANGLERFISH ================================== */
    .angler { position: fixed; left: 0; bottom: 1.8rem; z-index: 0;
      width: 8.5rem; pointer-events: none; animation: swim 34s linear infinite; animation-delay: -9s; }
    .angler-in { animation: bobSoft 4.6s ease-in-out infinite; }
    .angler svg { width: 100%; height: auto; display: block; }
    .lamp-glow { animation: lampPulse 2.4s ease-in-out infinite; transform-origin: center; }
    .fin { transform-origin: 20% 50%; animation: finFlap 1.1s ease-in-out infinite; }

    /* ===================== KONTEN =========================================== */
    .page { position: relative; z-index: 1; width: 100%; max-width: 30rem;
      padding: calc(var(--sky-h) - 4.3rem) 1.25rem calc(var(--floor-h) - 3.5rem); text-align: center; }

    /* --- Foto profil TERAPUNG di permukaan ombak --- */
    /* .avatar-zone menahan posisi; ombak tetap datar sementara foto bergoyang-miring */
    .avatar-zone { position: relative; width: 8.6rem; margin: 0 auto; }
    /* ombak bergelombang melintas DI DEPAN foto -> foto tampak setengah terendam */
    .float-wave { position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%);
      width: 100vw; height: 6.5rem; z-index: 2; pointer-events: none; }
    .float-wave svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .fw1 { animation: drift 9s linear infinite; }
    .fw2 { animation: drift 15s linear infinite; }
    .avatar-wrap { position: relative; width: 8.6rem;
      animation: floatTilt 6s ease-in-out infinite; }
    .avatar { width: 8.6rem; height: 8.6rem; border-radius: 50%; object-fit: cover;
      border: 4px solid rgba(255,255,255,.6); background: #0d4e6e;
      box-shadow: 0 0 0 10px rgba(180,235,255,.12), 0 18px 34px rgba(2,20,40,.55); }
    /* kilau seperti gelembung di foto */
    .avatar-wrap::after { content: ""; position: absolute; left: 18%; top: 12%;
      width: 30%; height: 20%; border-radius: 50%;
      background: linear-gradient(140deg, rgba(255,255,255,.75), rgba(255,255,255,0));
      pointer-events: none; }

    .name { font-weight: 800; font-size: clamp(1.7rem, 6vw, 2.4rem); margin-top: 1.15rem;
      letter-spacing: -.02em; text-shadow: 0 3px 14px rgba(2,26,48,.6); }
    .bio { margin-top: .65rem; font-size: .98rem; color: var(--muted); line-height: 1.55;
      text-shadow: 0 2px 8px rgba(2,26,48,.5); }

    /* --- Tombol GELEMBUNG --- */
    .links { margin-top: 1.9rem; display: flex; flex-direction: column; gap: 1rem; }
    .link { position: relative; overflow: hidden; display: block; text-align: left;
      padding: 1rem 1.5rem; border-radius: var(--radius-btn);
      background: var(--bubble); border: 1px solid var(--bubble-line);
      backdrop-filter: blur(4px);
      box-shadow: inset 0 6px 14px rgba(255,255,255,.22), inset 0 -8px 16px rgba(3,30,55,.30),
                  0 10px 22px -10px rgba(2,20,40,.75);
      animation: bobSoft 6s ease-in-out infinite;
      transition: box-shadow .18s ease, background-color .18s ease, border-color .18s ease; }
    /* kilau gelembung */
    .link::before { content: ""; position: absolute; left: 8%; top: 12%; width: 26%; height: 30%;
      border-radius: 50%; background: linear-gradient(145deg, rgba(255,255,255,.8), rgba(255,255,255,0));
      pointer-events: none; }
    .link::after { content: ""; position: absolute; right: 12%; bottom: 16%; width: 10%; height: 16%;
      border-radius: 50%; background: rgba(255,255,255,.35); pointer-events: none; }
    /* fase berbeda supaya tidak serempak */
    .link:nth-child(2) { animation-duration: 7.2s; animation-delay: -2.4s; }
    .link:nth-child(3) { animation-duration: 6.6s; animation-delay: -4.1s; }
    .link:nth-child(4) { animation-duration: 7.8s; animation-delay: -1.2s; }
    .link:nth-child(5) { animation-duration: 6.2s; animation-delay: -3.3s; }
    .link:hover { animation-play-state: paused; background: rgba(180,235,255,.28);
      border-color: rgba(255,255,255,.85);
      box-shadow: inset 0 6px 14px rgba(255,255,255,.3), inset 0 -8px 16px rgba(3,30,55,.26),
                  0 14px 26px -8px rgba(120,225,255,.5); }
    .link .t { font-weight: 700; font-size: 1.03rem; text-shadow: 0 2px 6px rgba(2,26,48,.55); }
    .link .s { font-size: .84rem; color: var(--muted); margin-top: .05rem; }
    /* Varian unggulan: gelembung bercahaya */
    .link.feature { background: rgba(140,240,255,.3); border-color: rgba(255,255,255,.9);
      box-shadow: inset 0 6px 16px rgba(255,255,255,.4), inset 0 -8px 16px rgba(3,60,90,.3),
                  0 0 26px rgba(130,235,255,.45), 0 12px 24px -10px rgba(2,20,40,.7); }
    /* Badge */
    .badge { position: absolute; top: .45rem; right: 1.2rem; z-index: 2;
      background: rgba(255,255,255,.9); color: #05405e; font-size: .62rem; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase; padding: .18rem .55rem; border-radius: 999px; }

    /* --- Sosial: gelembung kecil --- */
    .socials { margin-top: 1.8rem; display: flex; justify-content: center; gap: .75rem; }
    .socials a { position: relative; width: 2.9rem; height: 2.9rem; border-radius: 50%;
      background: var(--bubble); border: 1px solid var(--bubble-line);
      display: grid; place-items: center; animation: bobSoft 5.4s ease-in-out infinite;
      box-shadow: inset 0 4px 10px rgba(255,255,255,.25), 0 8px 16px -8px rgba(2,20,40,.7);
      transition: background .18s ease, border-color .18s ease; }
    .socials a::before { content: ""; position: absolute; left: 20%; top: 16%; width: 30%; height: 26%;
      border-radius: 50%; background: linear-gradient(145deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
    .socials a:nth-child(2) { animation-duration: 6.4s; animation-delay: -2s; }
    .socials a:nth-child(3) { animation-duration: 5.8s; animation-delay: -3.6s; }
    .socials a:hover { animation-play-state: paused; background: rgba(180,235,255,.3);
      border-color: rgba(255,255,255,.9); }
    .socials svg { width: 1.3rem; height: 1.3rem; fill: #fff; position: relative; }

    @media (prefers-reduced-motion: reduce) {
      .cloud, .rays i, .caustics span, .bubbles span, .weed path,
      .angler, .angler-in, .lamp-glow, .fin, .avatar-wrap, .fw1, .fw2, .link, .socials a { animation: none; }
      .bubbles, .caustics { display: none; }
      .angler { left: 8%; }
    }
  </style>
</head>

  <div class="floor" aria-hidden="true">

      </defs>
      <!-- gundukan pasir gelap -->
